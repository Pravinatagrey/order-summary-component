<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">

  <title> XOrder Summary Card</title>

</head>

<body>

  <main class="main">
    <article class="container">
      <div class="card__img-holder">
        <img src="images/illustration-hero.svg" alt="Illustration of a person listening to music.">
      </div>
      <div class="card__body">
        <h1  class="heading">Order Summary</h1>
        <p class="summary-para">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you
          like!</p>
       <!-- Plan Details -->
        <div class="plan-box">
          <div class="plan-box-left">
            <img src="images/icon-music.svg" alt="" aria-hidden="true">
            <div class="plan-text">
              <h3>Annual Plan</h3>
              <p>$59.99/year</p>
            </div>
          </div>
          <div class="plan-box-right">
             <div class="change-link">
                <a href="#">Change</a>
                  </div>
          </div>
        </div>
      </div>
      <div class="button-holder">
        <button class="btn payment-btn">Proceed to Payment</button>
        <button class="btn cancel-btn">Cancel Order</button>
      </div>
    </article>
  </main>
   <!-- Footer -->
    <footer class="attribution">
        Challenge by
        <a href="https://www.crio.do" target="_blank" rel="noopener noreferrer">
            Crio.do
        </a>.

        Coded by
        <a href="https://www.github.com/pravinatagrey" target="_blank" rel="noopener noreferrer">
            Praveen Atagrey
        </a>.

    </footer>
</body>
</html>
